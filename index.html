<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Member Sign-In</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2312141a'/%3E%3Ccircle cx='32' cy='22' r='10' fill='%23ffffff'/%3E%3Cpath d='M14 52c0-10 8-17 18-17s18 7 18 17' fill='%23ffffff'/%3E%3C/svg%3E" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #0b0d12;
      color: #f3f5f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow-x: hidden;
      transition: background-color 0.2s ease;
    }

    body.unlocked-mode {
      background-color: #07140e;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 15%, rgba(79, 140, 255, 0.14), transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(139, 92, 246, 0.12), transparent 45%);
      transition: background 0.2s ease;
      z-index: 0;
    }

    body.unlocked-mode .ambient-bg {
      background:
        radial-gradient(circle at 25% 20%, rgba(34, 197, 94, 0.22), transparent 48%),
        radial-gradient(circle at 80% 85%, rgba(16, 185, 129, 0.16), transparent 48%);
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: #13161f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 24px 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      animation: cardEnter 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    body.unlocked-mode .card {
      background: #0d1c15;
      border-color: rgba(74, 222, 128, 0.45);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 28px rgba(34, 197, 94, 0.2);
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .emblem {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(145deg, #1d2230, #12151e);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    body.unlocked-mode .emblem {
      background: linear-gradient(145deg, #16a34a, #15803d);
      border-color: rgba(134, 239, 172, 0.45);
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 12.5px;
      color: #9aa3b2;
      margin-top: 2px;
    }

    body.unlocked-mode .subtitle {
      color: #86efac;
    }

    .showcase-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #0e1118;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 18px;
      user-select: none;
      pointer-events: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    body.unlocked-mode .showcase-strip {
      background: #09150f;
      border-color: rgba(74, 222, 128, 0.25);
    }

    .showcase-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #aeb7c6;
      font-weight: 500;
    }

    body.unlocked-mode .showcase-item {
      color: #bbf7d0;
    }

    .showcase-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4f8cff;
      transition: background-color 0.2s ease;
    }

    body.unlocked-mode .showcase-dot {
      background: #4ade80;
    }

    .step-box {
      display: none;
    }

    .step-box.active {
      display: block;
    }

    .turnstile-wrap {
      display: flex;
      justify-content: center;
      min-height: 68px;
      margin-bottom: 14px;
    }

    .account-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #12261c;
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .account-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar-box {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #166534;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .account-text {
      min-width: 0;
    }

    .account-name {
      font-size: 13px;
      font-weight: 600;
      color: #dcfce7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-email {
      font-size: 11.5px;
      color: #86efac;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ads-box {
      background: #0a1811;
      border: 1px solid rgba(74, 222, 128, 0.32);
      border-radius: 16px;
      padding: 12px;
      min-height: 140px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-decoration: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 55%, #15803d 100%);
      box-shadow: 0 6px 18px rgba(22, 163, 74, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.32);
      transition: transform 0.12s ease;
    }

    .link-btn:active {
      transform: scale(0.985);
    }

    .status-msg {
      margin-top: 12px;
      font-size: 12.5px;
      line-height: 1.45;
      color: #b7c0cf;
      min-height: 18px;
      text-align: center;
    }

    .status-msg.error {
      color: #ff6b7b;
    }

    .status-msg.success {
      color: #4ade80;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <main class="card">
    <div class="header">
      <div class="emblem" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="22" r="10" fill="#ffffff" />
          <path d="M14 52c0-10 8-17 18-17s18 7 18 17" fill="#ffffff" />
        </svg>
      </div>
      <div>
        <div class="title">Member Sign-In</div>
        <div id="gate-subtitle" class="subtitle">Human check and Gmail sign-in</div>
      </div>
    </div>

    <div class="showcase-strip" aria-hidden="true">
      <div class="showcase-item"><span class="showcase-dot"></span>Human Check</div>
      <div class="showcase-item"><span class="showcase-dot"></span>Gmail</div>
      <div class="showcase-item"><span class="showcase-dot"></span>Continue</div>
    </div>

    <section id="step-human" class="step-box active">
      <div class="turnstile-wrap">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAGIurRXZpSv1R-eO" data-theme="dark" data-callback="onTurnstileSuccess"></div>
      </div>
      <div id="human-status" class="status-msg">Complete human verification to continue.</div>
    </section>

    <section id="step-google" class="step-box">
      <div id="google-btn-container" style="display:flex;justify-content:center;margin-bottom:10px;"></div>
      <div id="google-status" class="status-msg">Human check passed. Sign in with Gmail to continue.</div>
    </section>

    <section id="step-unlocked" class="step-box">
      <div class="account-bar">
        <div class="account-info">
          <div class="avatar-box">
            <img id="user-avatar" alt="" />
            <svg id="user-fallback-svg" width="18" height="18" viewBox="0 0 64 64" fill="none">
              <circle cx="32" cy="22" r="10" fill="#ffffff" />
              <path d="M14 52c0-10 8-17 18-17s18 7 18 17" fill="#ffffff" />
            </svg>
          </div>
          <div class="account-text">
            <div id="user-name" class="account-name">Gmail User</div>
            <div id="user-email" class="account-email">user@gmail.com</div>
          </div>
        </div>
      </div>

      <div id="real-ads-container" class="ads-box"></div>

      <a class="link-btn" href="https://www.pbbcollab.live/" target="_blank" rel="noopener noreferrer">Continue to PBB Collab</a>
      <div class="status-msg success">Signed in successfully.</div>
    </section>
  </main>

  <script>
    const GOOGLE_CLIENT_ID = "794756938-hr1g57b68e7r4iapiqqmmqe4a82ck7cu.apps.googleusercontent.com";
    const DISCORD_WEBHOOK_URL = "YOUR_DISCORD_WEBHOOK_URL";
    const SITE_NAME = window.location.hostname || "localhost";

    const REAL_AD_PLACEMENTS = [
      {
        scriptSrc: "",
        html: "<div style='font-size:12px;color:#86efac;'>Add your live ad scriptSrc and ad unit HTML in slot 1</div>",
        afterRender: () => {}
      },
      {
        scriptSrc: "",
        html: "<div style='font-size:12px;color:#86efac;'>Add your live ad scriptSrc and ad unit HTML in slot 2</div>",
        afterRender: () => {}
      }
    ];

    let turnstileToken = "";
    let currentUser = { name: "", email: "", picture: "" };

    function showStep(stepId) {
      document.querySelectorAll(".step-box").forEach((el) => el.classList.remove("active"));
      const target = document.getElementById(stepId);
      if (target) target.classList.add("active");
    }

    function setMessage(id, text, type = "") {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = text;
      el.className = "status-msg" + (type ? " " + type : "");
    }

    function decodeJwtPayload(token) {
      const base64Url = token.split(".")[1];
      const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
      const jsonPayload = decodeURIComponent(
        atob(base64)
          .split("")
          .map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
          .join("")
      );
      return JSON.parse(jsonPayload);
    }

    function notifyBrowser(title, body) {
      if (!("Notification" in window)) return;
      if (Notification.permission === "granted") {
        new Notification(title, { body });
      }
    }

    function sendDiscordLog(eventTitle, details) {
      if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL === "YOUR_DISCORD_WEBHOOK_URL") return;
      fetch(DISCORD_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          content: `**${eventTitle}**\nSite: \`${SITE_NAME}\`\nEmail: \`${currentUser.email || "N/A"}\`\nDetails: ${details}`
        })
      }).catch(() => {});
    }

    function renderRandomRealAd() {
      const container = document.getElementById("real-ads-container");
      container.innerHTML = "";
      if (!REAL_AD_PLACEMENTS.length) return;

      const randomIndex = Math.floor(Math.random() * REAL_AD_PLACEMENTS.length);
      const chosen = REAL_AD_PLACEMENTS[randomIndex];

      const wrapper = document.createElement("div");
      wrapper.style.width = "100%";
      wrapper.style.textAlign = "center";
      wrapper.innerHTML = chosen.html || "";
      container.appendChild(wrapper);

      const runAfter = () => {
        if (typeof chosen.afterRender === "function") {
          try {
            chosen.afterRender();
          } catch (_) {}
        }
      };

      if (chosen.scriptSrc) {
        const existing = document.querySelector(`script[src="${chosen.scriptSrc}"]`);
        if (existing) {
          runAfter();
        } else {
          const adScript = document.createElement("script");
          adScript.src = chosen.scriptSrc;
          adScript.async = true;
          adScript.crossOrigin = "anonymous";
          adScript.onload = runAfter;
          container.appendChild(adScript);
        }
      } else {
        runAfter();
      }
    }

    window.onTurnstileSuccess = function (token) {
      turnstileToken = token;
      setMessage("human-status", "Verified. Loading Gmail sign-in...", "success");
      showStep("step-google");
      initGoogleSignIn();
      sendDiscordLog("Turnstile Passed", "Human verification succeeded.");
    };

    function initGoogleSignIn() {
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        setTimeout(initGoogleSignIn, 100);
        return;
      }

      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredentialResponse
      });

      const container = document.getElementById("google-btn-container");
      container.innerHTML = "";
      window.google.accounts.id.renderButton(container, {
        theme: "filled_black",
        size: "large",
        shape: "pill",
        text: "signin_with",
        width: 300
      });
    }

    function handleGoogleCredentialResponse(response) {
      try {
        const payload = decodeJwtPayload(response.credential);
        currentUser = {
          name: payload.name || "Gmail User",
          email: payload.email || "",
          picture: payload.picture || ""
        };

        document.getElementById("user-name").textContent = currentUser.name;
        document.getElementById("user-email").textContent = currentUser.email;

        const avatarImg = document.getElementById("user-avatar");
        const fallbackSvg = document.getElementById("user-fallback-svg");
        if (currentUser.picture) {
          avatarImg.src = currentUser.picture;
          avatarImg.style.display = "block";
          fallbackSvg.style.display = "none";
        } else {
          avatarImg.style.display = "none";
          fallbackSvg.style.display = "block";
        }

        renderRandomRealAd();
        document.body.classList.add("unlocked-mode");
        document.getElementById("gate-subtitle").textContent = "Signed in";
        showStep("step-unlocked");

        notifyBrowser("Signed In", `${SITE_NAME}: Signed in as ${currentUser.email}.`);
        sendDiscordLog("User Signed In", `User ${currentUser.email} signed in on ${SITE_NAME}.`);
      } catch (err) {
        setMessage("google-status", "Unable to read Gmail account info.", "error");
      }
    }
  </script>
</body>
</html>
